# Template: run code-review-agent on every PR and post inline comments.
# Copy to .github/workflows/review.yml in a repo that has a GitHub remote.
# NOT active in this repository (no remote; live posting is unvalidated --
# W17 shipped it dry-run-first). Needs a DEEPSEEK_API_KEY repo secret.
name: crag-review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the PR branch, so read_file/context see the post-change tree
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install code-review-agent
        # from PyPI once published; meanwhile point pip at this repo
        run: python -m pip install "code-review-agent @ git+https://example.invalid/you/code_review_agent"
      - name: Review the PR and post inline comments
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          crag --pr ${{ github.event.pull_request.number }} --post \
               --trace review-trace.jsonl
      - name: Keep the trace as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-trace
          path: review-trace.jsonl
