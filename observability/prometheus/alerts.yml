groups:
  - name: crag-phase9f-production
    interval: 30s
    rules:
      - alert: CragQueueGrowing
        expr: predict_linear(queue_depth[15m], 900) > 100
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Review queue is growing
          runbook: Stop new submissions and inspect worker readiness and provider health.
      - alert: CragCompletionRateLow
        expr: sum(increase(review_jobs_total{status=~"awaiting_approval|declined|published"}[30m])) / clamp_min(increase(review_submissions_total[30m]), 1) < 0.95
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: Review completion rate is below target
          runbook: Inspect failed and dead-letter outcomes before retrying work.
      - alert: CragProviderErrorsHigh
        expr: sum(rate(llm_requests_total{status=~"429|5xx"}[5m])) / clamp_min(sum(rate(llm_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Provider 429 or 5xx responses are elevated
          runbook: Reduce concurrency and inspect normalized provider failure categories.
      - alert: CragReviewP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(review_duration_seconds_bucket[5m]))) > 600
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: Review p95 exceeds ten minutes
          runbook: Inspect queue wait and LLM request histograms to isolate the stage.
      - alert: CragDailyCostOverBudget
        expr: increase(llm_cost_cny_total[24h]) > 500
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Daily estimated model cost exceeds the configured operating budget
          runbook: Stop submissions and reconcile provider usage with the fixed FX setting.
      - alert: CragTelemetryDegraded
        expr: increase(degraded_total[10m]) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: Canonical telemetry is degraded
          runbook: Preserve local JSONL and inspect exporter and shared trace volume access.
      - alert: CragUnauthorizedOperation
        expr: increase(unauthorized_operations_total[10m]) > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: An unauthorized operation was denied
          runbook: Disable publication and review access-controlled audit records.
      - alert: CragApprovalReplayOrMismatch
        expr: increase(approval_validation_failures_total{reason=~"replay|mismatch"}[10m]) > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: Approval replay or binding mismatch was rejected
          runbook: Disable publication and preserve approval audit and canonical trace evidence.
