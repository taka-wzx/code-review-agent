x-app-image: &app-image
  image: code-review-agent-service:phase9c
  build:
    context: ${CRAG_BUILD_CONTEXT:?set a filtered build context}
    dockerfile: Dockerfile.service

x-database-environment: &database-environment
  CRAG_DATABASE_URL: postgresql+psycopg://crag@postgres:5432/crag
  CRAG_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
  CRAG_STATE_DIR: /var/lib/crag/state
  CRAG_JOB_DATA_DIR: /var/lib/crag/jobs
  CRAG_TRACE_DIR: /var/lib/crag/traces

x-service-environment: &service-environment
  <<: *database-environment
  CRAG_REPOSITORIES_JSON: ${CRAG_REPOSITORIES_JSON:?set container-path repository mappings}
  CRAG_WORKER_STALE_SECONDS: ${CRAG_WORKER_STALE_SECONDS:-30}

x-runtime-hardening: &runtime-hardening
  init: true
  read_only: true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crag
      POSTGRES_USER: crag
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crag -d crag"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - service

  migrate:
    <<: [*app-image, *runtime-hardening]
    profiles:
      - migration
    entrypoint: ["crag-entrypoint"]
    command: ["crag-db", "upgrade"]
    environment:
      <<: *database-environment
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - service

  api:
    <<: [*app-image, *runtime-hardening]
    environment:
      <<: *service-environment
      CRAG_WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      CRAG_ALLOW_LOCAL_TOKEN: ${CRAG_ALLOW_LOCAL_TOKEN:-false}
      CRAG_SERVICE_TOKEN_FILE: /run/secrets/service_token
      CRAG_SERVICE_HOST: ${CRAG_SERVICE_HOST:-0.0.0.0}
      CRAG_SERVICE_PORT: 8000
    secrets:
      - postgres_password
      - webhook_secret
      - service_token
    volumes:
      - service_artifacts:/var/lib/crag
      - type: bind
        source: ${CRAG_REPOSITORY_ROOT:?set a private repository root}
        target: /repositories
        read_only: true
    ports:
      - "127.0.0.1:${CRAG_PUBLISHED_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - crag-entrypoint
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: ${CRAG_CONTAINER_STOP_GRACE_PERIOD:-35s}
    restart: unless-stopped
    networks:
      - service

  worker:
    <<: [*app-image, *runtime-hardening]
    entrypoint: ["crag-entrypoint"]
    command: ["crag-worker"]
    environment:
      <<: *service-environment
      CRAG_WORKER_RUNNER: ${CRAG_WORKER_RUNNER:-real}
      CRAG_WORKER_CONCURRENCY: ${CRAG_WORKER_CONCURRENCY:-2}
      CRAG_JOB_LEASE_SECONDS: ${CRAG_JOB_LEASE_SECONDS:-60}
      CRAG_JOB_HEARTBEAT_SECONDS: ${CRAG_JOB_HEARTBEAT_SECONDS:-10}
      CRAG_WORKER_POLL_SECONDS: ${CRAG_WORKER_POLL_SECONDS:-1}
      CRAG_SHUTDOWN_GRACE_SECONDS: ${CRAG_SHUTDOWN_GRACE_SECONDS:-30}
      CRAG_RECEIVED_TIMEOUT_SECONDS: ${CRAG_RECEIVED_TIMEOUT_SECONDS:-60}
      CRAG_FAKE_RUN_SECONDS: ${CRAG_FAKE_RUN_SECONDS:-0}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY_FILE: /run/secrets/provider_api_key
      GLM_API_KEY_FILE: /run/secrets/provider_api_key
      ZHIPUAI_API_KEY_FILE: /run/secrets/provider_api_key
    secrets:
      - postgres_password
      - provider_api_key
    volumes:
      - service_artifacts:/var/lib/crag
      - type: bind
        source: ${CRAG_REPOSITORY_ROOT:?set a private repository root}
        target: /repositories
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "crag-entrypoint", "crag-worker", "--check"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: ${CRAG_CONTAINER_STOP_GRACE_PERIOD:-35s}
    restart: unless-stopped
    networks:
      - service

secrets:
  postgres_password:
    file: ${CRAG_POSTGRES_PASSWORD_FILE:?set a private Postgres password file}
  webhook_secret:
    file: ${CRAG_WEBHOOK_SECRET_FILE:?set a private Webhook secret file}
  service_token:
    file: ${CRAG_SERVICE_TOKEN_FILE:?set a private local/bootstrap token file}
  provider_api_key:
    file: ${CRAG_PROVIDER_API_KEY_FILE:?set a private provider-key file or noncredential fake-run fixture}

volumes:
  postgres_data:
  service_artifacts:

networks:
  service:
