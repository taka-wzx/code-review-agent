x-app-image: &app-image
  # A separately authorized deployment must replace this local build tag with an
  # immutable registry digest and record that digest in its deployment receipt.
  image: ${CRAG_SERVICE_IMAGE:-code-review-agent-service:phase11a-synthetic}
  build:
    context: ${CRAG_BUILD_CONTEXT:?set a filtered build context}
    dockerfile: Dockerfile.service
    args:
      DEBIAN_MIRROR: ${CRAG_DEBIAN_MIRROR:-https://deb.debian.org}
      PYPI_INDEX_URL: ${CRAG_PYPI_INDEX_URL:-https://pypi.org/simple}

x-database-environment: &database-environment
  CRAG_DATABASE_URL: postgresql+psycopg://crag@postgres:5432/crag
  CRAG_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
  CRAG_STATE_DIR: /var/lib/crag/state
  CRAG_JOB_DATA_DIR: /var/lib/crag/jobs
  CRAG_TRACE_DIR: /var/lib/crag/traces

x-service-environment: &service-environment
  <<: *database-environment
  # Synthetic staging never mounts a real repository.  The service image contains
  # only this empty, synthetic Git checkout for compatibility with the Review API.
  CRAG_REPOSITORIES_JSON: '${CRAG_REPOSITORIES_JSON:-{"synthetic/repository":"/synthetic/repository"}}'
  CRAG_WORKER_STALE_SECONDS: ${CRAG_WORKER_STALE_SECONDS:-30}

x-synthetic-repair-environment: &synthetic-repair-environment
  CRAG_REPAIR_RUNTIME: synthetic
  CRAG_REPAIR_PROVIDER: synthetic
  CRAG_REPAIR_PUBLISHER: dry_run

x-runtime-hardening: &runtime-hardening
  init: true
  read_only: true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_READ_SEARCH
    - KILL
    - SETGID
    - SETPCAP
    - SETUID
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crag
      POSTGRES_USER: crag
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crag -d crag"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - service

  migrate:
    <<: [*app-image, *runtime-hardening]
    profiles:
      - migration
    entrypoint: ["crag-entrypoint"]
    command: ["crag-db", "upgrade"]
    environment:
      <<: *database-environment
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - service

  api:
    <<: [*app-image, *runtime-hardening]
    environment:
      <<: [*service-environment, *synthetic-repair-environment]
      CRAG_WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      CRAG_ALLOW_LOCAL_TOKEN: ${CRAG_ALLOW_LOCAL_TOKEN:-false}
      CRAG_LOCAL_TOKEN_BEHIND_LOOPBACK_PUBLISH: ${CRAG_LOCAL_TOKEN_BEHIND_LOOPBACK_PUBLISH:-false}
      CRAG_SERVICE_TOKEN_FILE: /run/secrets/service_token
      CRAG_SERVICE_HOST: ${CRAG_SERVICE_HOST:-0.0.0.0}
      CRAG_SERVICE_PORT: 8000
    secrets:
      - postgres_password
      - webhook_secret
      - service_token
    volumes:
      - service_artifacts:/var/lib/crag
    ports:
      - "127.0.0.1:${CRAG_PUBLISHED_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - crag-entrypoint
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: ${CRAG_CONTAINER_STOP_GRACE_PERIOD:-35s}
    restart: unless-stopped
    networks:
      - service

  worker:
    <<: [*app-image, *runtime-hardening]
    entrypoint: ["crag-entrypoint"]
    command: ["crag-worker"]
    environment:
      <<: *service-environment
      # The synthetic staging Compose path never mounts or accepts a provider key.
      # Selecting the real runner therefore fails closed during worker startup.
      CRAG_WORKER_RUNNER: ${CRAG_WORKER_RUNNER:-fake}
      CRAG_WORKER_CONCURRENCY: ${CRAG_WORKER_CONCURRENCY:-2}
      CRAG_JOB_LEASE_SECONDS: ${CRAG_JOB_LEASE_SECONDS:-60}
      CRAG_JOB_HEARTBEAT_SECONDS: ${CRAG_JOB_HEARTBEAT_SECONDS:-10}
      CRAG_WORKER_POLL_SECONDS: ${CRAG_WORKER_POLL_SECONDS:-1}
      CRAG_SHUTDOWN_GRACE_SECONDS: ${CRAG_SHUTDOWN_GRACE_SECONDS:-30}
      CRAG_RECEIVED_TIMEOUT_SECONDS: ${CRAG_RECEIVED_TIMEOUT_SECONDS:-60}
      CRAG_FAKE_RUN_SECONDS: ${CRAG_FAKE_RUN_SECONDS:-0}
    secrets:
      - postgres_password
    volumes:
      - service_artifacts:/var/lib/crag
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "crag-entrypoint", "crag-worker", "--check"]
      interval: 10s
      timeout: 30s
      retries: 6
      start_period: 15s
    stop_grace_period: ${CRAG_CONTAINER_STOP_GRACE_PERIOD:-35s}
    restart: unless-stopped
    networks:
      - service

  repair-worker:
    <<: [*app-image, *runtime-hardening]
    entrypoint: ["crag-entrypoint"]
    command: ["crag-worker", "--synthetic-repair"]
    environment:
      <<: [*service-environment, *synthetic-repair-environment]
      CRAG_WORKER_CONCURRENCY: 1
      CRAG_JOB_LEASE_SECONDS: ${CRAG_JOB_LEASE_SECONDS:-60}
      CRAG_JOB_HEARTBEAT_SECONDS: ${CRAG_JOB_HEARTBEAT_SECONDS:-10}
      CRAG_WORKER_POLL_SECONDS: ${CRAG_WORKER_POLL_SECONDS:-1}
      CRAG_SHUTDOWN_GRACE_SECONDS: ${CRAG_SHUTDOWN_GRACE_SECONDS:-30}
    secrets:
      - postgres_password
    volumes:
      - service_artifacts:/var/lib/crag
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "crag-entrypoint", "crag-worker", "--synthetic-repair", "--check"]
      interval: 10s
      timeout: 30s
      retries: 6
      start_period: 15s
    stop_grace_period: ${CRAG_CONTAINER_STOP_GRACE_PERIOD:-35s}
    restart: unless-stopped
    networks:
      - service

secrets:
  postgres_password:
    file: ${CRAG_POSTGRES_PASSWORD_FILE:?set a private Postgres password file}
  webhook_secret:
    file: ${CRAG_WEBHOOK_SECRET_FILE:?set a private Webhook secret file}
  service_token:
    file: ${CRAG_SERVICE_TOKEN_FILE:?set a private local/bootstrap token file}

volumes:
  postgres_data:
  service_artifacts:

networks:
  service:
    internal: true
