[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-agent"
version = "0.1.0"
description = "Two-pass (finder + verifier) code-review agent over OpenAI-compatible APIs, with a reproducible eval harness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wang" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
# Upper bounds: the OpenAI SDK has a history of breaking changes at majors;
# a lockfile (requirements.lock) pins the exact CI/dev environment.
dependencies = [
    "fastapi>=0.139,<1",
    "mcp>=1.28,<2",
    "openai>=1.40,<3",
    "pyflakes>=3.0,<4",
    "uvicorn>=0.51,<1",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7,<8",
    "mypy>=1.13,<2",
    "ruff>=0.9,<1",
]

[project.scripts]
crag = "code_review_agent.agent:main"
crag-mcp = "code_review_agent.mcp_server:main"
crag-service = "code_review_agent.service:main"

# src/ layout: only the code_review_agent package is installable. The eval
# harness (run_eval/repeat_eval/judge/replay_verifier/bench_verifier/
# cost_report) resolves eval/ assets relative to the repo and stays repo-only.
[tool.setuptools]
package-dir = { "" = "src" }
packages = ["code_review_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"
# eval/ holds fixture repos with DELIBERATELY planted bugs (undefined
# names included) -- linting them would "fix" the eval set.
exclude = ["eval"]

[tool.ruff.lint]
# E/F/W to start (pyflakes + pycodestyle): catches real defects without
# imposing a style rewrite; tighten later if wanted.
select = ["E", "F", "W"]
ignore = ["E501"]  # long lines exist in prompts/docstrings; cap unenforced

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.10"
files = ["src/code_review_agent"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
