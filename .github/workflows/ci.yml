name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit + golden tests (zero API calls)
        run: python -m unittest discover -s tests -v
      - name: Eval asset consistency (diffs vs fixture repo vs truth)
        run: python eval/check_consistency.py eval eval/holdout
