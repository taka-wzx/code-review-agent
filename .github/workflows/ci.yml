name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Week 6 live-result validation proves the committed A4 freeze is
          # an ancestor of HEAD and therefore needs more than a shallow tip.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and dev validation tools
        run: python -m pip install -e ".[dev]"
      - name: Offline validation
        run: python scripts/verify.py --eval-assets

  lock-check:
    # The lockfile documents the exact environment evals were run in;
    # make sure it at least installs cleanly on the pinned interpreter.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install from lockfile
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -c "import code_review_agent"

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CLI image
        run: docker build --tag code-review-agent:ci .
      - name: Start CLI image
        run: docker run --rm code-review-agent:ci --help
