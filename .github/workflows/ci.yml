name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package (editable) + dev tools
        run: |
          python -m pip install -e .
          python -m pip install ruff coverage
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Unit + golden tests (zero API calls) with coverage
        run: python -m coverage run --source=src -m unittest discover -s tests -v
      - name: Coverage report (informational, no threshold yet)
        run: python -m coverage report --show-missing
      - name: Packaging smoke (console script starts)
        run: |
          crag --help
          python -m code_review_agent --help
      - name: Eval asset consistency (diffs vs fixture repo vs truth)
        run: python eval/check_consistency.py eval eval/holdout

  lock-check:
    # The lockfile documents the exact environment evals were run in;
    # make sure it at least installs cleanly on the pinned interpreter.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install from lockfile
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -c "import code_review_agent"
